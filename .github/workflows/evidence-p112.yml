# Temporary evidence workflow for PR #112's functional review (head 9c4f6a8).
# Lives on the fork branch evidence/p112 only; never merged. Setup mirrors windows.yml.
name: PR 112 evidence

on:
  workflow_dispatch:
  push:
    branches: [evidence/p112]

concurrency:
  group: evidence-p112
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # gentle-pi's Windows postinstall builds from source and needs Go >= 1.25.10.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      # stage-runtime.mjs spawns `pnpm` via Node spawnSync without a shell, and on this
      # image pnpm exists only as a .cmd shim, which spawnSync cannot execute (ENOENT).
      # Put the real standalone pnpm.exe on PATH; repo bytes stay untouched.
      - name: pnpm.exe on PATH for Node spawnSync
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'pnpm-exe'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'pnpm-win32-x64.zip'
          Invoke-WebRequest 'https://github.com/pnpm/pnpm/releases/download/v11.5.0/pnpm-win32-x64.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          Get-ChildItem $dir | ForEach-Object { Write-Host "unpacked: $($_.Name)" }
          if (-not (Test-Path (Join-Path $dir 'pnpm.exe'))) { throw 'pnpm.exe not found in the release zip' }
          (Get-FileHash (Join-Path $dir 'pnpm.exe') -Algorithm SHA256).Hash | Write-Host
          Add-Content $env:GITHUB_PATH $dir

      - name: Build self-contained installers
        run: |
          pnpm install --frozen-lockfile
          pnpm package:windows

      - name: Collect functional evidence
        shell: pwsh
        run: pwsh -File scripts/evidence/p112-collect.ps1 -RepoRoot . -OutDir "$env:RUNNER_TEMP\p112-evidence"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p112-evidence
          path: ${{ runner.temp }}\p112-evidence
          if-no-files-found: error

      - name: Upload NSIS installer (for the human GUI recording against this exact head)
        uses: actions/upload-artifact@v4
        with:
          name: p112-nsis-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*x64-setup.exe
          if-no-files-found: error
